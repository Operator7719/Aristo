    <script>
      // Gracefully prevent expected HMR WebSocket close events in iframe/Cloud Run environment from bubbling as errors
      window.addEventListener('error', function (e) {
        if (
          e.message &&
          (e.message.includes('WebSocket') || e.message.includes('@vite/client'))
        ) {
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e.reason &&
          e.reason.message &&
          (e.reason.message.includes('WebSocket') ||
            e.reason.message.includes('@vite/client'))
        ) {
          e.preventDefault();
        }
      });
    </script>
